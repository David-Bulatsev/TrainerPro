services:
  proxy:
    image: nginx:1.27-alpine
    container_name: coach_proxy
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - public
      - app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost}
    container_name: coach_frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app

  backend:
    build:
      context: ./backend
    container_name: coach_backend
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-coach}:${POSTGRES_PASSWORD:-coach}@db:5432/${POSTGRES_DB:-coach_app}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost}
      STORAGE_BACKEND: s3
      STORAGE_S3_ENDPOINT_URL: http://minio:9000
      STORAGE_S3_PUBLIC_ENDPOINT_URL: ${STORAGE_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_S3_BUCKET: ${MINIO_BUCKET}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_PRESIGN_EXPIRES_SECONDS: ${STORAGE_PRESIGN_EXPIRES_SECONDS:-3600}
      STORAGE_MAX_FILE_SIZE_BYTES: ${STORAGE_MAX_FILE_SIZE_BYTES:-10485760}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      WEATHER_API_BASE_URL: ${WEATHER_API_BASE_URL:-https://api.openweathermap.org}
      WEATHER_TIMEOUT_SECONDS: ${WEATHER_TIMEOUT_SECONDS:-8}
      WEATHER_MAX_RETRIES: ${WEATHER_MAX_RETRIES:-2}
      WEATHER_RATE_LIMIT: ${WEATHER_RATE_LIMIT:-20}
      WEATHER_RATE_WINDOW_SECONDS: ${WEATHER_RATE_WINDOW_SECONDS:-60}
      WEATHER_FORECAST_LIMIT: ${WEATHER_FORECAST_LIMIT:-5}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - app

  db:
    image: postgres:15-alpine
    container_name: coach_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coach}
      POSTGRES_DB: ${POSTGRES_DB:-coach_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coach} -d ${POSTGRES_DB:-coach_app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: coach_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - app

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    container_name: coach_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}" &&
        (mc mb -p "local/${MINIO_BUCKET}" || true)
    restart: "no"
    networks:
      - app

volumes:
  postgres_data:
  minio_data:

networks:
  public:
    driver: bridge
  app:
    driver: bridge
